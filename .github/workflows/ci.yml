# ==============================================================================
# CI/CD Pipeline — GitHub Actions
# ==============================================================================
# Runs on every push and pull request to main.
# Steps: checkout → setup Java → build → test
#
# This demonstrates Continuous Integration:
# Every push triggers automated build and test, catching issues early.

name: CI - Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Java 17 (matching our pom.xml)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # 3. Build and run tests
      - name: Build with Maven
        working-directory: services/incident-service
        run: mvn clean verify -B

      # 4. Upload test results (visible in GitHub Actions UI)
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: services/incident-service/target/surefire-reports/
